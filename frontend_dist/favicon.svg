<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2a3040" stroke-width="2"/>
  <!-- 面积填充 -->
  <polygon points="12,44 24,38 34,42 44,28 52,18 52,54 12,54" fill="url(#area)"/>
  <!-- 上升折线 -->
  <polyline points="12,44 24,38 34,42 44,28 52,18" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 金色端点 + 上涨箭头 -->
  <circle cx="52" cy="18" r="3.5" fill="#d29922"/>
  <path d="M50,24 L52,18 L46,20" fill="none" stroke="#d29922" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
